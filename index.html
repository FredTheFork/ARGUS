<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ARGUS — Instant Object Recognition</title>
<meta name="description" content="ARGUS: an on-device recognition camera. Point it at an object and it is outlined and named on the feed — instantly. Everything runs locally; nothing leaves the device.">
<meta name="theme-color" content="#05070a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARGUS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ══ boot ═══════════════════════════════════════════════════════ -->
<div id="boot" class="boot">
  <div class="boot-card">
    <h1 class="boot-word">ARGUS</h1>
    <p class="boot-sub" id="boot-stage">Initialising</p>
    <div class="boot-bar"><i id="boot-pct"></i></div>
    <div class="boot-lines" id="boot-lines"></div>
    <div class="boot-error" id="boot-error" hidden>
      <h2 id="boot-error-title">Core offline</h2>
      <p id="boot-detail"></p>
      <div class="row">
        <button id="boot-retry" class="btn">Retry</button>
        <button id="demo-fallback" class="btn ghost" hidden>Run demo feed</button>
      </div>
    </div>
    <p class="boot-ver"><span id="boot-ver">3.0.0</span> · instant on-device recognition</p>
  </div>
</div>

<!-- ══ stage ══════════════════════════════════════════════════════
     The feed is the interface. Everything on it is drawn, nothing on
     it can be pressed. The only DOM besides the video and the overlay
     canvas is the two-line status readout (pointer-events: none). -->
<main id="stage" class="stage" hidden>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="hud"></canvas>
  <div class="status" aria-hidden="true">
    <span class="status-left"><span class="status-dot"></span><span class="status-brand">ARGUS</span><span id="status-left">recognising</span></span>
    <span class="status-right" id="status-right">on-device · nothing leaves this phone</span>
  </div>
</main>

<noscript>
  <div style="position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#05070a;color:#eef2f6;font-family:system-ui,sans-serif">
    <p style="max-width:34ch;text-align:center;line-height:1.6">ARGUS needs JavaScript — every model runs locally, on this device, in your browser.</p>
  </div>
</noscript>

<script>
/* ══ boot watchdog — deliberately OUTSIDE the module graph ════════════════
 *
 * Everything else in this app is an ES module. If the module graph fails to
 * load — one 404 out of 20 files, a proxy that answers a .js request with an
 * HTML error page, a browser too old for module syntax — app.js never runs,
 * nothing ever un-sticks the boot card, and the user stares at "Initialising"
 * forever. This tiny classic script is the last line of defence:
 *
 *   · it notices when the app has shown no sign of life at all, and
 *   · it notices when the app was alive but stopped making progress,
 *
 * …and in either case it says so on the boot screen and offers a working
 * Retry (wired here, not in app.js, so it works even when app.js cannot).
 * It is idempotent, guarded everywhere, and stands down the instant the app
 * reports ready or shows its own error.
 */
(function () {
  'use strict';
  var NO_LIFE_MS = 25000;    // the module graph has silently failed by now
  var STUCK_MS = 90000;      // alive, but one stage made no progress this long
  var lastPhase = window.__argusPhase || null;
  var lastChange = Date.now();
  var reported = false;

  function $(id) { return document.getElementById(id); }
  function appDone() {
    var boot = $('boot');
    return !!window.__argusReady || !boot || boot.hidden;
  }
  function appFailed() {
    var box = $('boot-error');
    return !!window.__argusFailed || (box && !box.hidden);
  }

  // Retry must work even when app.js never loads — wire it here as well.
  var retry = $('boot-retry');
  if (retry && !retry.dataset.wired) {
    retry.dataset.wired = '1';
    retry.addEventListener('click', function () { try { window.location.reload(); } catch (e) { /* sandboxed */ } });
  }

  function report(message) {
    if (reported || appDone() || appFailed()) return;
    reported = true;
    var box = $('boot-error');
    var title = $('boot-error-title');
    var detail = $('boot-detail');
    if (title) title.textContent = 'Startup is taking unusually long';
    if (detail) detail.textContent = message;
    if (box) box.hidden = false;
    var demo = $('demo-fallback');
    if (demo) demo.hidden = false;
  }

  setInterval(function () {
    try {
      if (reported || appDone() || appFailed()) return;
      var phase = window.__argusPhase || null;
      if (phase !== lastPhase) { lastPhase = phase; lastChange = Date.now(); }
      var quiet = Date.now() - lastChange;
      if (!phase && quiet > NO_LIFE_MS) {
        report('The application scripts did not start — usually a blocked or half-downloaded file, or a browser without modern JavaScript support. Retry, or try another browser.');
      } else if (phase && quiet > STUCK_MS) {
        report('Startup stopped progressing at “' + String(phase).toLowerCase() + '” ' + Math.round(quiet / 1000) + ' seconds ago. A retry usually clears a wedged download.');
      }
    } catch (e) { /* the watchdog itself must never break the page */ }
  }, 5000);
})();
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
