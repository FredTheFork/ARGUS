<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ARGUS aperture mark">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#061420"/>
      <stop offset="100%" stop-color="#02060c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ce0ff" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#4ce0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>

  <!-- tracking ring -->
  <g stroke="#1b6f8c" stroke-width="4.5" stroke-linecap="round">
    <path d="M256 84.4 A171.6 171.6 0 0 1 302 89.1"/>
    <path d="M338.6 104.1 A171.6 171.6 0 0 1 376.3 134"/>
    <path d="M398.2 168.6 A171.6 171.6 0 0 1 418.3 210.4"/>
    <path d="M425.5 256 A171.6 171.6 0 0 1 418.3 301.6"/>
    <path d="M398.2 343.4 A171.6 171.6 0 0 1 376.3 378"/>
    <path d="M338.6 407.9 A171.6 171.6 0 0 1 302 422.9"/>
    <path d="M256 427.6 A171.6 171.6 0 0 1 210 422.9"/>
    <path d="M173.4 407.9 A171.6 171.6 0 0 1 135.7 378"/>
    <path d="M113.8 343.4 A171.6 171.6 0 0 1 93.7 301.6"/>
    <path d="M86.5 256 A171.6 171.6 0 0 1 93.7 210.4"/>
    <path d="M113.8 168.6 A171.6 171.6 0 0 1 135.7 134"/>
    <path d="M173.4 104.1 A171.6 171.6 0 0 1 210 89.1"/>
  </g>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="#4ce0ff" stroke-width="5.9"/>

  <!-- aperture blades -->
  <g fill="#02060c">
    <path d="M256 103 L 351 158 L 268 164 Z"/>
    <path d="M409 256 L 354 351 L 348 268 Z"/>
    <path d="M256 409 L 161 354 L 244 348 Z"/>
    <path d="M103 256 L 158 161 L 164 244 Z"/>
  </g>

  <!-- iris disc + pupil -->
  <circle cx="256" cy="256" r="153" fill="none" stroke="#4ce0ff" stroke-width="15" stroke-dasharray="300 40" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="59" fill="none" stroke="#4ce0ff" stroke-width="7"/>
  <circle cx="256" cy="256" r="22" fill="#4ce0ff"/>

  <!-- corner brackets -->
  <g stroke="#4ce0ff" stroke-width="7" stroke-linecap="square" fill="none">
    <path d="M28 87 V28 H87"/>
    <path d="M425 28 H484 V87"/>
    <path d="M484 425 V484 H425"/>
    <path d="M87 484 H28 V425"/>
